[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papercuts"
version = "0.1.0"
description = "Cut through the literature: an evidence-mapping engine that ingests, screens, extracts, maps and queries academic papers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thabiso Masenya" }]
keywords = ["literature-review", "systematic-review", "meta-analysis", "openalex", "bm25", "knowledge-graph", "nlp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
papercuts = "papercuts.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits real APIs (run with: pytest -m live)"]
addopts = "-m 'not live'"
